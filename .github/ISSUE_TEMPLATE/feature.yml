# The sidebar's feedback button (crates/app/src/bugreport.rs) opens this form with the version filled in.
name: Feature request
description: Something Oskestra could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like
      description: What you're trying to do and what would help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Oskestra version
